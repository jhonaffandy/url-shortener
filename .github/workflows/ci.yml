# Format: name: <nama workflow, tampil di tab Actions>
name: CI

# Format: on: <event pemicu>: branches: [<nama branch>]
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Format: <nama-job>: (bebas, ini nama "test")
  test:
    # Mesin yang dipakai Github buat jalanin job
    runs-on: ubuntu-latest
    steps:
      # Format: -uses: <owner>/<action>@<versi> -> pakai action jadi orang lain
      # Ambil kode repo ke mesin tadi
      - uses: actions/checkout@v4

      # Install Go; versi dibaca dari go.mod lo (nggak perlu nebak versi)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Format: - run: <command shell biasa>
      - run: go test ./... -v
  build:
    # Format: needs: <nama-job-lain>
    # build cuma jalan kalo job 'test' hijau
    needs: test
    runs-on: ubuntu-latest
    steps:
      # Format: uses: <owner>/<action>@<versi>
      # ambil kode repo ke runner
      - uses: actions/checkout@v4

      - name: Build Docker image
        # Format: docker build -t <nama>:<tag> <path-folder-Dockerfile>
        # -t = kasih nama + tag ke image
        # . = folder Dockerfile (root repo)
        run: docker build -t url-shortener:ci .
  # Format job: nama_job: {needs, if, runs-on, steps}
  # needs   = nunggu job ini sukses dulu: [job1,job2]
  # if      = konidsi jalan. Di sini: cuma push ke main (bukan PR)
  deploy:
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # Format step: -name: <label>
      #               run: <command shell>
      # ${{  secrets.NAMA }} = ambil nilai dari GitHub Secrets
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{  secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # Format ssh: ssh <user>@<host> "<command di VPS>"
      - name: Tes koneksi
        run: ssh ${{  secrets.VPS_USER }}@${{  secrets.VPS_HOST }} "hostname && whoami"
