# Blok 1: port 80 -> jalur verifikasi Let's Encrypt + redirect ke HTTPS
server {
    listen 80;
    server_name johanplaygrnd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Format: return <kode> <url-tujuan>;
    # $request_uri = path + query asli dari request
    location / {
        return 301 https://$host$request_uri;
    }
}

# BLOK N8N
# Format: server_name <subdomain>;  -> nginx pilih blok ini kalau header Host cocok
server {
    listen 80;
    server_name n8n.johanplaygrnd.space;

    # folder challenge yang sama dengan domain utama (volume ./certbot/www)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Blok 2: port 443 -> HTTPS beneran
server {
    # Format: listen <port> ssl;
    listen 443 ssl;
    server_name johanplaygrnd.space;

    # ssl_certificate       = cert publik (+ chain)
    # ssl_certificate_key   = private key
    ssl_certificate     /etc/letsencrypt/live/johanplaygrnd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/johanplaygrnd.space/privkey.pem;

    # Format: location <prefix> {proxy_[ass http://<service>:<port>/;}
    # "/" di akhir proxy_pass = prefix a/a/ dibuang sebelum diteruskan ke app
    location /a/ {
        proxy_pass http://app:8080/;
    }

    location /b/ {
        proxy_pass http://app2:8080/;
    }

    # Exact match (=): hanya path /health persis, diteruskan ke app
    location = /health{
        proxy_pass http://app:8080/health;
    }
}