# Format: location <prefix>/ { proxy_pass <http://nama-service:port>/; }
# "/" di akhir proxy_pass = prefix (/a/) dibuang sebelum diteruskan ke app

server {
    listen 80;
    server_name johanplaygrnd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /a/ {
        proxy_pass http://app:8080/;
    }

    location /b/ {
        proxy_pass http://app2:8080/;
    }
}