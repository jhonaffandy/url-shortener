# Format: map <variabel-sumber> <variabel-baru> { <nilai-sumber> <hasil>; ... }
# Kalau request bawa header Upgrade (WebSocket) -> Connection "upgrade", kalau nggak -> "close"
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Blok 1: port 80 -> jalur verifikasi Let's Encrypt + redirect ke HTTPS
server {
    listen 80;
    server_name johanplaygrnd.space;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Format: return <kode> <url-tujuan>;
    # $request_uri = path + query asli dari request
    location / {
        return 301 https://$host$request_uri;
    }
}

# BLOK N8N
# Format: server_name <subdomain>;  -> nginx pilih blok ini kalau header Host cocok
server {
    listen 80;
    server_name n8n.johanplaygrnd.space;

    # folder challenge yang sama dengan domain utama (volume ./certbot/www)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Blok 2: port 443 -> HTTPS beneran
server {
    # Format: listen <port> ssl;
    listen 443 ssl;
    server_name johanplaygrnd.space;

    # ssl_certificate       = cert publik (+ chain)
    # ssl_certificate_key   = private key
    ssl_certificate     /etc/letsencrypt/live/johanplaygrnd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/johanplaygrnd.space/privkey.pem;

    # Format: location <prefix> {proxy_[ass http://<service>:<port>/;}
    # "/" di akhir proxy_pass = prefix a/a/ dibuang sebelum diteruskan ke app
    location /a/ {
        proxy_pass http://app:8080/;
    }

    location /b/ {
        proxy_pass http://app2:8080/;
    }

    # Exact match (=): hanya path /health persis, diteruskan ke app
    location = /health{
        proxy_pass http://app:8080/health;
    }
}

server {
    listen 443 ssl;
    server_name n8n.johanplaygrnd.space;

    ssl_certificate     /etc/letsencrypt/live/n8n.johanplaygrnd.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.johanplaygrnd.space/privkey.pem;

    # Format: resolver <dns-server> valid=<lama cache>;
    # 127.0.0.11 = DNS internal Docker. Dipakai bareng "set $var" di bawah
    resolver 127.0.0.11 valid=30s;

    location / {
        # nama n8n baru di-resolve saat ada request, bukan saat nginx start.
        # Tanpa ini, kalau container n8n mati, nginx gagal start dan
        # url-shortener ikut mati.
        set $n8n_upstream http://n8n:5678;
        proxy_pass $n8n_upstream;

        proxy_http_version 1.1;                          # WebSocket butuh HTTP/1.1
        proxy_set_header Host $host;                     # teruskan hostname asli
        proxy_set_header X-Real-IP $remote_addr;         # IP client asli
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;      # n8n tahu aslinya https
        proxy_set_header Upgrade $http_upgrade;          # header WebSocket
        proxy_set_header Connection $connection_upgrade; # dari map di atas
    }
}