# services:
#   <nama sercie>:
#     build: <path konteks  build>
#     ports: ["<port host>:<port di container>"]
#     volume: ["<nama volume>:<path di container>"]
#
# volumes:
#   <nama volume>:    -> deklarasi named volume

services:
  app:
    build: .
    expose:
      - "8080"
    # ports:
    #   - "8080:8080"
    volumes:
      - urls_data:/app/data

  app2:
    build: .
    volumes:
      - urls_data2:/app/data

  # Format: nginx:
  #   image: <nama image>
  #   port: ["<port host>:<port container>"]
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    # Format: - <path file di host>:<path di container>:ro
    # ro = read-only, nginx cuma baca config
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro # folder challenge (Certbot nulis, Nginx baca)
      - ./certbot/conf:/etc/letsencrypt:ro # rempat cert (Certbot nulis, Nginx baca)

volumes:
  urls_data:
  urls_data2:
