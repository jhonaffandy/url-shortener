# services:
#   <nama sercie>:
#     build: <path konteks  build>
#     ports: ["<port host>:<port di container>"]
#     volume: ["<nama volume>:<path di container>"]
#
# volumes:
#   <nama volume>:    -> deklarasi named volume

services:
  app:
    build: .
    restart: unless-stopped
    expose:
      - "8080"
    # ports:
    #   - "8080:8080"
    volumes:
      - urls_data:/app/data

  app2:
    build: .
    restart: unless-stopped
    volumes:
      - urls_data2:/app/data

  # Format: nginx:
  #   image: <nama image>
  #   port: ["<port host>:<port container>"]
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    # Format: - <path file di host>:<path di container>:ro
    # ro = read-only, nginx cuma baca config
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/www:/var/www/certbot:ro # folder challenge (Certbot nulis, Nginx baca)
      - ./certbot/conf:/etc/letsencrypt:ro # rempat cert (Certbot nulis, Nginx baca)
    # Format: networks: [<nama network>, ...]
    # default = network bawaan compose ini (biar nginx tetap nyambung ke app & app2)
    # proxy   = network bersama (nanti nyambung ke n8n)
    networks: # <-- TAMBAH
      - default # <-- TAMBAH
      - proxy # <-- TAMBAH

volumes:
  urls_data:
  urls_data2:

# Format: networks:
#   <nama>:
#     external: true   -> network sudah ada di Docker, compose cuma "numpang", nggak bikin/hapus
networks: # <-- TAMBAH (blok baru di paling bawah)
  proxy:
    external: true
