services:
  uptime-kuma:
    image: louislam/uptime-kuma:2    # format: <repo>:<tag>. Kalau pull gagal, ganti, ganti 1
    container_name: uptime-kuma      # nama container
    restart: unless-stopped          # nyala lagi otomatis setelah reboot/crash
    ports:
      - "127.0.0.1:3001:3001"        # format: "<ip-host>:<posrt-host>:<port-container>" (cuma localhost VPS)
    volumes:
      - ./data:/app/data             # format: <folder-host><folder-container> (data monitor tersimpan)
